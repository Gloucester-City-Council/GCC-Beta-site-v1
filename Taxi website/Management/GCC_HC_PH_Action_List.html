<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCC HC/PH — Action List</title>
<style>
:root{
  --deep:#1F3763;--blue:#0054A4;--white:#fff;--grey:#f9fafb;
  --border:#e5e7eb;--text:#111827;--text2:#6b7280;
  --query:#1565c0;--query-bg:#e3f0fc;
  --changed:#b45309;--changed-bg:#fef3cd;
  --rejected:#b91c1c;--rejected-bg:#fee2e2;
  --done:#1a7a3a;--done-bg:#e6f4ec;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--grey);color:var(--text);line-height:1.6;font-size:16px}
.hdr{background:var(--deep);color:#fff;padding:20px 32px}
.hdr h1{font-size:1.375rem;font-weight:700;margin-bottom:4px}
.hdr p{font-size:.875rem;color:rgba(255,255,255,.75)}
.toolbar{background:#fff;border-bottom:1px solid var(--border);
  padding:12px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font-family:inherit;font-size:.875rem;font-weight:600;padding:8px 16px;
  border:none;cursor:pointer;border-radius:4px}
.btn-primary{background:var(--deep);color:#fff}
.btn-primary:hover{background:#162c54}
.btn-secondary{background:var(--grey);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:#f3f4f6}
.filter-group{display:flex;gap:8px;align-items:center;margin-left:auto}
.filter-group label{font-size:.875rem;color:var(--text2)}
.filter-group select{font-family:inherit;font-size:.875rem;padding:6px 10px;
  border:1px solid var(--border);border-radius:4px;background:#fff}
.stats{padding:12px 32px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;gap:24px;font-size:.875rem;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px}
.stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.main{max-width:1100px;margin:0 auto;padding:24px 32px}
.page-group{margin-bottom:32px}
.page-title{font-size:1rem;font-weight:700;color:var(--deep);
  background:#fff;border:1px solid var(--border);border-bottom:none;
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.page-badge{font-size:.75rem;font-weight:600;background:var(--deep);
  color:#fff;padding:2px 8px;border-radius:12px}
.action-card{background:#fff;border:1px solid var(--border);
  border-bottom:none;transition:background .15s}
.action-card:last-child{border-bottom:1px solid var(--border)}
.action-card.done{background:var(--done-bg)}
.card-header{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.card-id{font-family:monospace;font-size:.8125rem;font-weight:700;
  background:#f3f4f6;padding:2px 6px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.card-body{flex:1;min-width:0}
.card-status{display:inline-flex;align-items:center;gap:4px;
  font-size:.75rem;font-weight:700;padding:2px 8px;margin-bottom:6px}
.status-query{background:var(--query-bg);color:var(--query)}
.status-changed{background:var(--changed-bg);color:var(--changed)}
.status-rejected{background:var(--rejected-bg);color:var(--rejected)}
.status-done{background:var(--done-bg);color:var(--done)}
.card-comment{font-size:.9375rem;font-weight:600;color:var(--deep);margin-bottom:6px}
.card-detail{font-size:.875rem;color:var(--text2);margin-bottom:10px}
.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-expand{font-size:.8125rem;color:var(--blue);cursor:pointer;
  background:none;border:none;font-family:inherit;padding:0;text-decoration:underline}
.notes-section{padding:0 16px 14px 16px;border-top:1px dashed var(--border);
  display:none;margin-top:4px}
.notes-section.open{display:block}
.notes-label{font-size:.8125rem;font-weight:600;color:var(--text2);margin-bottom:4px}
.notes-input{width:100%;font-family:inherit;font-size:.875rem;padding:8px;
  border:1px solid var(--border);resize:vertical;min-height:64px;
  background:#fff;color:var(--text)}
.notes-input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.complete-btn{font-family:inherit;font-size:.8125rem;font-weight:600;
  padding:6px 14px;border:none;cursor:pointer;border-radius:3px}
.complete-btn.mark{background:var(--done);color:#fff}
.complete-btn.mark:hover{background:#156030}
.complete-btn.unmark{background:#e5e7eb;color:var(--text)}
.complete-btn.unmark:hover{background:#d1d5db}
.done-stamp{font-size:.8125rem;font-weight:700;color:var(--done);margin-left:auto}
.save-pill{font-size:.8125rem;color:var(--text2);padding:4px 10px;
  background:var(--grey);border:1px solid var(--border);border-radius:12px}
@media print{
  .toolbar,.filter-group,.card-expand,.notes-section,.complete-btn{display:none!important}
  .action-card.done{display:none}
}
</style>
</head>
<body>

<div class="hdr">
  <h1>GCC HC/PH — Manager Action List</h1>
  <p>Actions arising from manager review · July 2026 · <span id="pending-count"></span> pending · <span id="done-count"></span> completed</p>
</div>

<div class="toolbar">
  <button class="btn btn-primary" onclick="exportJSON()">Export progress (JSON)</button>
  <label class="btn btn-secondary" style="cursor:pointer">
    Import progress (JSON)
    <input type="file" accept=".json" style="display:none" onchange="importJSON(event)">
  </label>
  <button class="btn btn-secondary" onclick="window.print()">Print / PDF</button>
  <div class="filter-group">
    <label>Filter:</label>
    <select onchange="setFilter(this.value)">
      <option value="all">All items</option>
      <option value="pending">Pending only</option>
      <option value="done">Completed only</option>
      <option value="query">Queries</option>
      <option value="changed">Changed</option>
      <option value="rejected">Rejected</option>
    </select>
    <select onchange="setPage(this.value)" id="page-filter">
      <option value="all">All pages</option>
    </select>
  </div>
</div>

<div class="stats" id="stats"></div>
<div class="main" id="main"></div>

let progress = {};

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) progress = JSON.parse(s);
  } catch(e) { progress = {}; }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(progress));
  document.getElementById('pending-count').textContent = 
    Object.values(progress).filter(v => v.done).length + ' of ' + ACTIONS.length + ' done';
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(progress, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gcc_hcph_actions_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      progress = data;
      save();
      render();
      alert('Progress imported successfully.');
    } catch(err) {
      alert('Invalid JSON file.');
    }
  };
  reader.readAsText(file);
}

function toggleDone(id) {
  if (!progress[id]) progress[id] = {};
  progress[id].done = !progress[id].done;
  save();
  render();
}

function saveNote(id, val) {
  if (!progress[id]) progress[id] = {};
  progress[id].notes = val;
  save();
}

function toggleNotes(id) {
  const el = document.getElementById('notes-' + safeId(id));
  el.classList.toggle('open');
}

function safeId(id) {
  return id.replace(/[^a-zA-Z0-9]/g, '_');
}

let currentFilter = 'all';
let currentPage = 'all';

function setFilter(val) { currentFilter = val; render(); }
function setPage(val) { currentPage = val; render(); }

function render() {
  const done = ACTIONS.filter(a => progress[a.id]?.done).length;
  const pending = ACTIONS.length - done;
  document.getElementById('pending-count').textContent = pending + ' pending';
  document.getElementById('done-count').textContent = done + ' completed';

  // Stats bar
  const byStatus = {};
  ACTIONS.forEach(a => {
    byStatus[a.status] = (byStatus[a.status]||0) + 1;
  });
  const colours = {query:'#1565c0',changed:'#b45309',rejected:'#b91c1c'};
  document.getElementById('stats').innerHTML = 
    Object.entries(byStatus).map(([s,c]) =>
      `<div class="stat"><div class="stat-dot" style="background:${colours[s]||'#374151'}"></div>
       <span>${c} ${s}</span></div>`
    ).join('') +
    `<div class="stat"><div class="stat-dot" style="background:#1a7a3a"></div><span>${done} completed</span></div>`;

  // Group by page
  const pages = {};
  ACTIONS.forEach(a => {
    if (!pages[a.page]) pages[a.page] = [];
    pages[a.page].push(a);
  });

  // Populate page filter
  const pf = document.getElementById('page-filter');
  const existingPages = Array.from(pf.options).map(o => o.value);
  Object.keys(pages).sort().forEach(p => {
    if (!existingPages.includes(p)) {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      pf.appendChild(opt);
    }
  });

  let html = '';
  Object.keys(pages).sort().forEach(page => {
    if (currentPage !== 'all' && currentPage !== page) return;

    const items = pages[page].filter(a => {
      if (currentFilter === 'pending') return !progress[a.id]?.done;
      if (currentFilter === 'done') return progress[a.id]?.done;
      if (currentFilter === 'query') return a.status === 'query';
      if (currentFilter === 'changed') return a.status === 'changed';
      if (currentFilter === 'rejected') return a.status === 'rejected';
      return true;
    });
    if (!items.length) return;

    const pageCount = items.length;
    const pageDone = items.filter(a => progress[a.id]?.done).length;

    html += `<div class="page-group">
      <div class="page-title">
        <span>📄 ${page}</span>
        <span class="page-badge">${pageDone}/${pageCount}</span>
      </div>`;

    items.forEach(a => {
      const isDone = progress[a.id]?.done || false;
      const note = progress[a.id]?.notes || '';
      const sid = safeId(a.id);

      html += `<div class="action-card${isDone?' done':''}" id="card-${sid}">
        <div class="card-header">
          <code class="card-id">${a.id}</code>
          <div class="card-body">
            <div class="card-status status-${a.status}">${a.status.toUpperCase()}</div>
            <p class="card-comment">${a.comment || '(No comment recorded)'}</p>
            ${a.detail ? `<p class="card-detail">${a.detail.slice(0,250)}${a.detail.length>250?'…':''}</p>` : ''}
            <div class="card-actions">
              <button class="complete-btn ${isDone?'unmark':'mark'}" onclick="toggleDone('${a.id}')">
                ${isDone ? '✓ Mark as pending' : '✓ Mark complete'}
              </button>
              <button class="card-expand" onclick="toggleNotes('${a.id}')">
                ${note ? '📝 Notes' : '+ Add notes'}
              </button>
              ${isDone ? '<span class="done-stamp">✓ Completed</span>' : ''}
            </div>
          </div>
        </div>
        <div class="notes-section${note?' open':''}" id="notes-${sid}">
          <div class="notes-label">Notes / implementation detail</div>
          <textarea class="notes-input" placeholder="Add notes about how this was implemented or why it was deferred…"
            onchange="saveNote('${a.id}', this.value)">${note}</textarea>
        </div>
      </div>`;
    });

    html += '</div>';
  });

  document.getElementById('main').innerHTML = html;
}

load();
render();
</script>
</body>
</html>
